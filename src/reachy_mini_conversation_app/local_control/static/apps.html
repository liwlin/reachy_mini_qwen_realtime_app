<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>Reachy Mini 应用管理</title>
    <link rel="stylesheet" href="/assets/style.css">
    <script src="/assets/app.js" defer></script>
  </head>
  <body data-page="apps">
    <main class="shell shell--setup">
      <header class="topbar">
        <div class="brand-heading">
          <img class="brand-logo" src="/assets/makerseed-logo.png" alt="种子创客工坊">
          <div>
            <h1>应用管理</h1>
            <p class="brand-name">种子创客工坊 · 种子菌</p>
            <p id="connection-copy" class="connection-copy">正在读取已安装 App…</p>
          </div>
        </div>
        <a class="text-link" href="/">返回控制</a>
      </header>

      <section id="login-panel" class="login-panel" aria-labelledby="login-title">
        <h2 id="login-title">输入机器人 PIN</h2>
        <form id="login-form" class="inline-form">
          <label for="pin">机器人 PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
          <button class="button button--primary" type="submit">进入应用管理</button>
        </form>
        <p id="login-error" class="message message--error" hidden></p>
      </section>

      <div id="control-panel" hidden>
        <section aria-labelledby="apps-title">
          <div class="section-heading">
            <h2 id="apps-title">已安装应用</h2>
            <button class="button button--quiet button--small" data-action="refresh-apps" type="button">刷新</button>
          </div>
          <div id="app-list" class="catalog-list" aria-live="polite"></div>
          <p id="operation-message" class="message" aria-live="polite"></p>
        </section>
      </div>
    </main>

    <dialog id="app-switch-dialog" class="confirm-dialog" aria-labelledby="app-switch-title">
      <form method="dialog">
        <h2 id="app-switch-title">切换应用</h2>
        <p>停止当前应用并启动所选应用？</p>
        <p id="app-switch-target" class="message"></p>
        <div class="dialog-actions">
          <button class="button" value="cancel">取消</button>
          <button class="button button--primary" value="confirm">确认切换</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
