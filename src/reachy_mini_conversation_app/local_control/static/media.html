<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>Reachy Mini 音视频控制</title>
    <link rel="stylesheet" href="/assets/style.css">
    <script src="/assets/local-webrtc.js" defer></script>
    <script src="/assets/app.js" defer></script>
  </head>
  <body data-page="media">
    <main class="shell">
      <header class="topbar">
        <div class="brand-heading">
          <img class="brand-logo" src="/assets/makerseed-logo.png" alt="种子创客工坊">
          <div>
            <h1>音视频控制</h1>
            <p class="brand-name">种子创客工坊 · 种子菌</p>
            <p id="connection-copy" class="connection-copy">等待连接机器人媒体…</p>
          </div>
        </div>
        <a class="text-link" href="/">返回本地控制</a>
      </header>

      <section id="login-panel" class="login-panel" aria-labelledby="login-title">
        <h2 id="login-title">输入机器人 PIN</h2>
        <p>PIN 用于保护同一局域网中的音量和控制操作。</p>
        <form id="login-form" class="inline-form">
          <label for="pin">机器人 PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
          <button class="button button--primary" type="submit">进入控制</button>
        </form>
        <p id="login-error" class="message message--error" hidden></p>
      </section>

      <div id="control-panel" hidden>
        <section aria-labelledby="camera-title">
          <div class="section-heading">
            <h2 id="camera-title">实时画面</h2>
            <span id="video-status-badge" class="status-badge">未连接</span>
          </div>
          <div id="camera-stage" class="camera-stage">
            <video id="camera-video" muted playsinline autoplay aria-label="Reachy Mini 实时摄像头画面"></video>
            <p id="camera-overlay" class="camera-overlay">点击“连接画面”开始</p>
          </div>
          <div class="video-controls">
            <button class="button button--primary" data-action="video-connect" type="button">连接画面</button>
            <button class="button" data-action="video-disconnect" type="button" disabled>断开画面</button>
            <button class="button" data-action="video-fullscreen" type="button">全屏</button>
          </div>
          <p class="privacy-note">只接收静音视频，不会在手机播放机器人麦克风声音，也不会请求手机摄像头或麦克风权限。</p>
        </section>

        <section aria-labelledby="volume-title">
          <div class="section-heading">
            <h2 id="volume-title">声音调节</h2>
            <button class="button button--quiet button--small" data-action="media-refresh" type="button">刷新</button>
          </div>
          <div class="volume-grid">
            <article class="volume-card">
              <div class="volume-heading">
                <label for="speaker-volume">扬声器</label>
                <output id="speaker-volume-value" for="speaker-volume">—</output>
              </div>
              <input id="speaker-volume" type="range" min="0" max="100" step="1" value="50" disabled>
              <button class="button button--small" data-action="speaker-mute" type="button" disabled>静音</button>
              <small>松开滑块后应用，机器人会播放一次短提示音。</small>
            </article>
            <article class="volume-card">
              <div class="volume-heading">
                <label for="microphone-volume">麦克风输入</label>
                <output id="microphone-volume-value" for="microphone-volume">—</output>
              </div>
              <input id="microphone-volume" type="range" min="0" max="100" step="1" value="50" disabled>
              <button class="button button--small" data-action="microphone-mute" type="button" disabled>静音</button>
              <small>调节机器人听到现场声音的输入音量。</small>
            </article>
          </div>
        </section>

        <p id="operation-message" class="message" aria-live="polite"></p>
      </div>
    </main>

    <footer id="emergency-bar" class="emergency-bar" hidden>
      <button class="emergency-stop" data-action="emergency-stop" type="button">立即停止</button>
    </footer>
  </body>
</html>
